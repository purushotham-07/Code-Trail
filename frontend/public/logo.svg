<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ct-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container (rounded squircle) -->
  <rect width="100" height="100" rx="24" fill="#0b1329" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="url(#ct-gradient)" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Code Trail Branching Lines -->
  <path d="M28 35 L44 50 L28 65" stroke="url(#ct-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M72 35 L56 50 L72 65" stroke="url(#ct-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Trail & Nodes -->
  <path d="M50 24 L50 76" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.6" />
  <circle cx="50" cy="30" r="5" fill="url(#node-gradient)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="50" cy="70" r="5" fill="url(#node-gradient)" filter="url(#glow)" />
</svg>
